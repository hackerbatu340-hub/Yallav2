name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Manuel tetikleme butonu

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 kur (Android Gradle için gerekli)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter kur
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Bağımlılıkları yükle
      - name: Flutter pub get
        run: flutter pub get

      # 5. (İsteğe bağlı) Analiz - hataları yakala
      - name: Analyze
        run: flutter analyze || true

      # 6. Release APK derle
      - name: Build APK
        run: flutter build apk --release

      # 7. APK'yı artifact olarak yükle
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla_clone_release_apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 8. Her push'ta otomatik "release" oluştur (sürümlü)
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
